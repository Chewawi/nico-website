# Info for the gallery on nico.kodeko.org. Put this file in the top folder of the drawings repo.
#
# Everything in here is optional. A drawing that isn't listed still shows up on the site:
# its title comes from the filename, and it goes after the listed ones, newest first.
#
# Listed drawings show in the order they're written here. For each one you can set:
#   title:     shown on hover and in the viewer         (default: the filename, minus .png)
#   category:  the filter button it goes under          (default: drawings; "logos" or "sheets" if the name says so)
#   featured:  true shows it bigger                     (default: false)
#   alt:       what the picture shows, for people who can't see it   (default: the title)
#   year:      shown under the title                    (optional)
#   hidden:    true keeps it off the site               (default: false)
#
# The name has to match the file exactly, including capitals and .png.
# Files whose name starts with _ or ., or contains "DO NOT REPOST", never show up.
# Only .png .jpg .webp .gif and .avif files are used (.kra, .svg and .ico are skipped).

